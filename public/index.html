<!DOCTYPE html>
<html>
  <head>
    <title>B2B Chess</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
    />
    <style>
      :root {
        /* Atom One Dark Color Scheme */
        --background: #282c34;
        --current-line: #44475a;
        --foreground: #f8f8f2;
        --comment: #6272a4;
        --cyan: #8be9fd;
        --green: #50fa7b;
        --orange: #ffb86c;
        --pink: #ff79c6;
        --purple: #bd93f9;
        --red: #ff5555;
        --yellow: #f1fa8c;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--background);
        color: var(--foreground);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 350px;
        gap: 30px;
        align-items: start;
      }

      header {
        grid-column: 1 / -1;
        text-align: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 2px solid var(--purple);
      }

      h1 {
        font-size: 2.5rem;
        background: linear-gradient(45deg, var(--purple), var(--pink));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 10px;
        text-shadow: 0 0 10px rgba(189, 147, 249, 0.3);
      }

      .subtitle {
        color: var(--comment);
        font-size: 1.1rem;
        font-weight: 300;
      }

      #board {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        background: var(--current-line);
        padding: 20px;
      }

      .controls {
        background: var(--current-line);
        border-radius: 10px;
        padding: 25px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      }

      .player-selector {
        margin-bottom: 25px;
      }

      .player-selector h3 {
        color: var(--cyan);
        margin-bottom: 15px;
        font-size: 1.3rem;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .player-selector h3.white::before {
        content: "●";
        color: white;
      }

      .player-selector h3.black::before {
        content: "●";
        color: black;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--foreground);
        font-weight: 500;
      }

      select {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        background: var(--background);
        border: 2px solid var(--comment);
        color: var(--foreground);
        font-size: 1rem;
        margin-bottom: 15px;
        transition: border-color 0.3s ease;
      }

      select:focus {
        outline: none;
        border-color: var(--purple);
        box-shadow: 0 0 0 3px rgba(189, 147, 249, 0.3);
      }

      .buttons {
        display: flex;
        gap: 15px;
        margin-bottom: 25px;
      }

      button {
        flex: 1;
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      #startGame {
        background: linear-gradient(45deg, var(--green), var(--cyan));
        color: var(--background);
      }

      #resetGame {
        background: linear-gradient(45deg, var(--red), var(--orange));
        color: white;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }

      button:active {
        transform: translateY(0);
      }

      .status-container {
        background: var(--background);
        border-radius: 8px;
        padding: 20px;
        margin-top: 20px;
      }

      .status-container h3 {
        color: var(--yellow);
        margin-bottom: 15px;
        font-size: 1.2rem;
      }

      #status, #pgn {
        background: var(--current-line);
        padding: 15px;
        border-radius: 6px;
        font-family: 'Courier New', monospace;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.5;
      }

      #status {
        color: var(--green);
        margin-bottom: 15px;
        min-height: 24px;
      }

      #pgn {
        color: var(--foreground);
        font-size: 0.9rem;
      }

      .chessboard-placeholder {
        aspect-ratio: 1/1;
        background: linear-gradient(45deg, var(--comment), var(--current-line));
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--foreground);
        font-size: 1.2rem;
        opacity: 0.8;
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }
        
        #board {
          max-width: 100%;
        }
        
        .buttons {
          flex-direction: column;
        }
      }

      /* Chessboard styling enhancements */
      .cg-wrap {
        border-radius: 4px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>B2B Chess</h1>
        <p class="subtitle">Battle Bots in the Ultimate Chess Arena</p>
      </header>

      <div id="board">
        <div class="chessboard-placeholder">Chess Board Loading...</div>
      </div>

      <div class="controls">
        <div class="player-selector">
          <h3 class="white">White Player</h3>
          <label for="whitePlayer">Select White Player:</label>
          <select id="whitePlayer">
            <option value="human">Human</option>
            <option value="fairy-stockfish-largeboard_x86-64.exe">
              Fairy Stockfish (Windows)
            </option>
            <option value="stockfish-windows-x86-64-avx2.exe">
              Stockfish AVX2 (Windows)
            </option>
            <option value="fairy-stockfish_x86-64">Fairy Stockfish (Linux)</option>
            <option value="stockfish-ubuntu-x86-64-avx2">Stockfish AVX2 (Linux)</option>
          </select>
        </div>

        <div class="player-selector">
          <h3 class="black">Black Player</h3>
          <label for="blackPlayer">Select Black Player:</label>
          <select id="blackPlayer">
            <option value="human">Human</option>
            <option value="stockfish-windows-x86-64-avx2.exe">
              Stockfish AVX2 (Windows)
            </option>
            <option value="fairy-stockfish-largeboard_x86-64.exe">
              Fairy Stockfish (Windows)
            </option>
            <option value="fairy-stockfish_x86-64">Fairy Stockfish (Linux)</option>
            <option value="stockfish-ubuntu-x86-64-avx2">Stockfish AVX2 (Linux)</option>
          </select>
        </div>

        <div class="buttons">
          <button id="startGame">Start Game</button>
          <button id="resetGame">Reset Game</button>
        </div>

        <div class="status-container">
          <h3>Game Status</h3>
          <div id="status">Ready to start game</div>
          <h3>Move History</h3>
          <div id="pgn">No moves yet</div>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
      const socket = io();
      let board = null;
      const game = new Chess();
      const status = $("#status");
      const pgn = $("#pgn");
      let whitePlayer = "human";
      let blackPlayer = "stockfish-windows-x86-64-avx2.exe";

      function onDragStart(source, piece, position, orientation) {
        // do not pick up pieces if the game is over
        if (game.game_over()) return false;

        // only pick up pieces for the side to move
        if (
          (game.turn() === "w" && piece.search(/^b/) !== -1) ||
          (game.turn() === "b" && piece.search(/^w/) !== -1)
        ) {
          return false;
        }

        if (
          (game.turn() === "w" && whitePlayer !== "human") ||
          (game.turn() === "b" && blackPlayer !== "human")
        ) {
          return false;
        }
      }

      function onDrop(source, target) {
        // see if the move is legal
        let move;
        try {
          move = game.move({
            from: source,
            to: target,
            promotion: "q", // NOTE: always promote to a queen for simplicity
          });
        } catch (e) {
          // illegal move
          console.log(e);
        }

        if (move === null) return "snapback";

        socket.emit("makeMove", move);
      }

      // update the board position after the piece snap
      // for castling, en passant, pawn promotion
      function onSnapEnd() {
        board.position(game.fen());
      }

      const config = {
        draggable: true,
        position: "start",
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd,
        appearSpeed: 300,
        moveSpeed: 200,
        snapbackSpeed: 100,
        snapSpeed: 150
      };
      
      // Initialize board after a short delay to ensure DOM is ready
      setTimeout(() => {
        board = Chessboard("board", config);
        // Remove placeholder
        document.querySelector('.chessboard-placeholder').style.display = 'none';
      }, 100);

      socket.on("boardState", (fen) => {
        try {
          game.load(fen);
        } catch (e) {
          console.log(e);
        }
        if (board) {
          board.position(fen);
        }
      });

      socket.on("gameStatus", (msg) => {
        status.text(msg);
      });

      socket.on("gamePgn", (pgnStr) => {
        pgn.text(pgnStr);
      });

      $("#startGame").on("click", () => {
        whitePlayer = $("#whitePlayer").val();
        blackPlayer = $("#blackPlayer").val();
        socket.emit("startGame", {
          whiteBot: whitePlayer,
          blackBot: blackPlayer,
        });
      });

      $("#resetGame").on("click", () => {
        socket.emit("resetGame");
      });
    </script>
  </body>
</html>
