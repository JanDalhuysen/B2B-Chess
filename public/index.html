<!DOCTYPE html>
<html>
  <head>
    <title>B2B Chess</title>
    <!-- integrity="sha384-q94+BZYoMzvU2LwZj3iU5DbveC/5VLEuZTF2R7/AkPNMl/TEMBROgJ26mIVpFkct" -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
    />
    <!-- crossorigin="anonymous"> -->
    <style>
      body {
        font-family: sans-serif;
      }
      #board {
        width: 400px;
      }
    </style>
  </head>
  <body>
    <h1>B2B Chess</h1>
    <div id="board"></div>

    <div>
      <label for="whitePlayer">White Player:</label>
      <select id="whitePlayer">
        <option value="human">Human</option>
        <option value="fairy-stockfish-largeboard_x86-64.exe">
          fairy-stockfish-largeboard_x86-64.exe
        </option>
        <option value="stockfish-windows-x86-64-avx2.exe">
          stockfish-windows-x86-64-avx2.exe
        </option>
        <option value="fairy-stockfish_x86-64">Fairy Stockfish Linux</option>
        │
        <option value="stockfish-ubuntu-x86-64-avx2">Stockfish Linux</option>
      </select>
    </div>
    <div>
      <label for="blackPlayer">Black Player:</label>
      <select id="blackPlayer">
        <option value="human">Human</option>
        <option value="stockfish-windows-x86-64-avx2.exe">
          stockfish-windows-x86-64-avx2.exe
        </option>
        <option value="fairy-stockfish-largeboard_x86-64.exe">
          fairy-stockfish-largeboard_x86-64.exe
        </option>
        <option value="fairy-stockfish_x86-64">Fairy Stockfish Linux</option>
        │
        <option value="stockfish-ubuntu-x86-64-avx2">Stockfish Linux</option>
      </select>
    </div>
    <button id="startGame">Start Game</button>
    <button id="resetGame">Reset Game</button>
    <p id="status"></p>
    <p id="pgn"></p>

    <script src="/socket.io/socket.io.js"></script>
    <!-- integrity="sha384-ZvpUoO/+PpLXR1lu4jmpXWu80pZlYUAfxl5NsBMWOEPSjUn/6Z/hRTt8+pR6L4N2" -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- crossorigin="anonymous"></script> -->
    <!-- integrity="sha384-8Vi8VHwn3vjQ9eUHUxex3JSN/Angelodf1A4_A+BgqIjC/bFGDp/7HOKLHhAg2zQ+" -->
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <!-- crossorigin="anonymous"></script> -->
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0-beta.8/chess.min.js"></script> -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- integrity="sha512-bfi2JzgoGAi8GLeT62xI2V2aR2wJmaD/eI0Gf9i22/V2ItL2GgdTsd+tL1a2LgnTZEs20H/xQ22iC2P95J0/YA=="  -->
    <!-- crossorigin="anonymous" referrerpolicy="no-referrer"></script> -->

    <script>
      const socket = io();
      let board = null;
      const game = new Chess();
      const status = $("#status");
      const pgn = $("#pgn");
      let whitePlayer = "human";
      let blackPlayer = "stockfish-windows-x86-64-avx2.exe";

      function onDragStart(source, piece, position, orientation) {
        // do not pick up pieces if the game is over
        if (game.game_over()) return false;

        // only pick up pieces for the side to move
        if (
          (game.turn() === "w" && piece.search(/^b/) !== -1) ||
          (game.turn() === "b" && piece.search(/^w/) !== -1)
        ) {
          return false;
        }

        if (
          (game.turn() === "w" && whitePlayer !== "human") ||
          (game.turn() === "b" && blackPlayer !== "human")
        ) {
          return false;
        }
      }

      function onDrop(source, target) {
        // see if the move is legal
        let move;
        try {
          move = game.move({
            from: source,
            to: target,
            promotion: "q", // NOTE: always promote to a queen for simplicity
          });
        } catch (e) {
          // illegal move
          console.log(e);
        }

        if (move === null) return "snapback";

        socket.emit("makeMove", move);
      }

      // update the board position after the piece snap
      // for castling, en passant, pawn promotion
      function onSnapEnd() {
        board.position(game.fen());
      }

      const config = {
        draggable: true,
        position: "start",
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd,
      };
      board = Chessboard("board", config);

      socket.on("boardState", (fen) => {
        try {
          game.load(fen);
        } catch (e) {
          console.log(e);
        }
        board.position(fen);
      });

      socket.on("gameStatus", (msg) => {
        status.text(msg);
      });

      socket.on("gamePgn", (pgnStr) => {
        pgn.text(pgnStr);
      });

      $("#startGame").on("click", () => {
        whitePlayer = $("#whitePlayer").val();
        blackPlayer = $("#blackPlayer").val();
        socket.emit("startGame", {
          whiteBot: whitePlayer,
          blackBot: blackPlayer,
        });
      });

      $("#resetGame").on("click", () => {
        socket.emit("resetGame");
      });
    </script>
  </body>
</html>
