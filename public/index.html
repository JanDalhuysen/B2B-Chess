<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B2B Chess</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
    <style>
      :root {
        /* Atom One Dark Color Scheme */
        --background: #282c34;
        --current-line: #44475a;
        --foreground: #f8f8f2;
        --comment: #6272a4;
        --cyan: #8be9fd;
        --green: #50fa7b;
        --orange: #ffb86c;
        --pink: #ff79c6;
        --purple: #bd93f9;
        --red: #ff5555;
        --yellow: #f1fa8c;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--background);
        color: var(--foreground);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 350px;
        gap: 30px;
        align-items: start;
      }

      header {
        grid-column: 1 / -1;
        text-align: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 2px solid var(--purple);
      }

      h1 {
        font-size: 2.5rem;
        background: linear-gradient(45deg, var(--purple), var(--pink));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 10px;
        text-shadow: 0 0 10px rgba(189, 147, 249, 0.3);
      }

      .subtitle {
        color: var(--comment);
        font-size: 1.1rem;
        font-weight: 300;
      }

      #board {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        background: var(--current-line);
        padding: 20px;
      }

      .controls {
        background: var(--current-line);
        border-radius: 10px;
        padding: 25px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      }

      .player-selector {
        margin-bottom: 25px;
      }

      .player-selector h3 {
        color: var(--cyan);
        margin-bottom: 15px;
        font-size: 1.3rem;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .player-selector h3.white::before {
        content: '●';
        color: white;
      }

      .player-selector h3.black::before {
        content: '●';
        color: black;
      }

      .model-selector {
        margin-top: 10px;
        padding: 15px;
        background: var(--background);
        border-radius: 6px;
        border-left: 3px solid var(--purple);
      }

      .model-selector.hidden {
        display: none;
      }

      .hidden {
        display: none;
      }

      .model-selector label {
        color: var(--purple);
        font-size: 0.9rem;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--foreground);
        font-weight: 500;
      }

      select {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        background: var(--background);
        border: 2px solid var(--comment);
        color: var(--foreground);
        font-size: 1rem;
        margin-bottom: 15px;
        transition: border-color 0.3s ease;
      }

      input {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        background: var(--background);
        border: 2px solid var(--comment);
        color: var(--foreground);
        font-size: 1rem;
        margin-bottom: 15px;
        transition: border-color 0.3s ease;
      }

      select:focus {
        outline: none;
        border-color: var(--purple);
        box-shadow: 0 0 0 3px rgba(189, 147, 249, 0.3);
      }

      input:focus {
        outline: none;
        border-color: var(--purple);
        box-shadow: 0 0 0 3px rgba(189, 147, 249, 0.3);
      }

      .setup-status {
        font-size: 0.9rem;
        color: var(--comment);
        padding: 10px;
        border-radius: 6px;
        background: rgba(98, 114, 164, 0.15);
        margin-top: 8px;
      }

      .shortcut-row {
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
      }

      .secondary-button {
        padding: 8px 12px;
        flex: 0;
        font-size: 0.75rem;
        background: linear-gradient(45deg, var(--purple), var(--comment));
        color: var(--foreground);
      }

      .buttons {
        display: flex;
        gap: 15px;
        margin-bottom: 25px;
      }

      button {
        flex: 1;
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      #startGame {
        background: linear-gradient(45deg, var(--green), var(--cyan));
        color: var(--background);
      }

      #resetGame {
        background: linear-gradient(45deg, var(--red), var(--orange));
        color: white;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }

      button:active {
        transform: translateY(0);
      }

      .status-container {
        background: var(--background);
        border-radius: 8px;
        padding: 20px;
        margin-top: 20px;
      }

      .status-container h3 {
        color: var(--yellow);
        margin-bottom: 15px;
        font-size: 1.2rem;
      }

      #status,
      #pgn {
        background: var(--current-line);
        padding: 15px;
        border-radius: 6px;
        font-family: 'Courier New', monospace;
        white-space: pre-wrap;
        word-break: break-word;
        line-height: 1.5;
      }

      #status {
        color: var(--green);
        margin-bottom: 15px;
        min-height: 24px;
      }

      #pgn {
        color: var(--foreground);
        font-size: 0.9rem;
      }

      .chessboard-placeholder {
        aspect-ratio: 1/1;
        background: linear-gradient(45deg, var(--comment), var(--current-line));
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--foreground);
        font-size: 1.2rem;
        opacity: 0.8;
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }

        #board {
          max-width: 100%;
        }

        .buttons {
          flex-direction: column;
        }
      }

      /* Chessboard styling enhancements */
      .cg-wrap {
        border-radius: 4px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>B2B Chess</h1>
        <p class="subtitle">Battle Bots in the Ultimate Chess Arena</p>
      </header>

      <div id="board">
        <div class="chessboard-placeholder">Chess Board Loading...</div>
      </div>

      <div class="controls">
        <div class="player-selector">
          <h3 class="white">White Player</h3>
          <label for="whitePlayerType">Player Type:</label>
          <select id="whitePlayerType">
            <option value="human">Human</option>
            <option value="engine">Local Engine</option>
            <option value="ai">AI Model (via MCP)</option>
          </select>

          <div id="whiteEngineSelector" class="model-selector hidden">
            <label for="whiteEngine">Engine:</label>
            <select id="whiteEngine">
              <option value="">Loading engines...</option>
            </select>
          </div>

          <div id="whiteAiSelector" class="model-selector hidden">
            <label for="whiteAiProvider">Provider:</label>
            <select id="whiteAiProvider">
              <option value="ollama">Ollama (Local)</option>
              <option value="openrouter">OpenRouter (Online)</option>
            </select>

            <div id="whiteOllamaModelGroup">
              <label for="whiteOllamaModel">Model (Ollama):</label>
              <select id="whiteOllamaModel">
                <option value="">Loading models...</option>
              </select>
            </div>

            <div id="whiteOpenRouterModelGroup" class="hidden">
              <label for="whiteOpenRouterPreset">Quick Pick:</label>
              <select id="whiteOpenRouterPreset">
                <option value="">Custom model...</option>
              </select>

              <label for="whiteOpenRouterModel">Model (OpenRouter):</label>
              <input
                id="whiteOpenRouterModel"
                list="openrouterModelList"
                placeholder="e.g. qwen/qwen3-next-80b-a3b-instruct:free"
              />
            </div>

            <div id="whiteAiStatus" class="setup-status">Checking AI setup...</div>
          </div>
        </div>

        <div class="player-selector">
          <h3 class="black">Black Player</h3>
          <label for="blackPlayerType">Player Type:</label>
          <select id="blackPlayerType">
            <option value="human">Human</option>
            <option value="engine">Local Engine</option>
            <option value="ai">AI Model (via MCP)</option>
          </select>

          <div id="blackEngineSelector" class="model-selector hidden">
            <label for="blackEngine">Engine:</label>
            <select id="blackEngine">
              <option value="">Loading engines...</option>
            </select>
          </div>

          <div id="blackAiSelector" class="model-selector hidden">
            <label for="blackAiProvider">Provider:</label>
            <select id="blackAiProvider">
              <option value="ollama">Ollama (Local)</option>
              <option value="openrouter">OpenRouter (Online)</option>
            </select>

            <div id="blackOllamaModelGroup">
              <label for="blackOllamaModel">Model (Ollama):</label>
              <select id="blackOllamaModel">
                <option value="">Loading models...</option>
              </select>
            </div>

            <div id="blackOpenRouterModelGroup" class="hidden">
              <label for="blackOpenRouterPreset">Quick Pick:</label>
              <select id="blackOpenRouterPreset">
                <option value="">Custom model...</option>
              </select>

              <label for="blackOpenRouterModel">Model (OpenRouter):</label>
              <input
                id="blackOpenRouterModel"
                list="openrouterModelList"
                placeholder="e.g. qwen/qwen3-next-80b-a3b-instruct:free"
              />
            </div>

            <div id="blackAiStatus" class="setup-status">Checking AI setup...</div>
          </div>
        </div>

        <datalist id="openrouterModelList"></datalist>

        <div class="buttons">
          <button id="startGame">Start Game</button>
          <button id="resetGame">Reset Game</button>
        </div>

        <div class="status-container">
          <h3>Game Status</h3>
          <div id="status">Ready to start game</div>
          <h3>Move History</h3>
          <div id="pgn">No moves yet</div>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
      const SETUP_STORAGE_KEY = 'b2b-chess-player-setup-v1';
      const socket = io();
      let board = null;
      const game = new Chess();
      const status = $('#status');
      const pgn = $('#pgn');

      let whitePlayerConfig = { kind: 'human' };
      let blackPlayerConfig = { kind: 'human' };
      let availableBots = [];
      let ollamaModels = [];
      let openrouterModels = [];
      let aiStatus = {
        ollama: { reachable: false, url: 'http://localhost:11434', defaultModel: '' },
        openrouter: { apiKeyDetected: false, defaultModel: '' },
      };

      function populateEngineSelectors() {
        const whiteEngine = $('#whiteEngine');
        const blackEngine = $('#blackEngine');
        whiteEngine.empty();
        blackEngine.empty();

        if (!availableBots.length) {
          whiteEngine.append('<option value="">No engines available</option>');
          blackEngine.append('<option value="">No engines available</option>');
          return;
        }

        availableBots.forEach((bot) => {
          whiteEngine.append(`<option value="${bot.value}">${bot.name}</option>`);
          blackEngine.append(`<option value="${bot.value}">${bot.name}</option>`);
        });
      }

      function populateOllamaSelectors() {
        const whiteModel = $('#whiteOllamaModel');
        const blackModel = $('#blackOllamaModel');
        whiteModel.empty();
        blackModel.empty();

        if (!ollamaModels.length) {
          whiteModel.append('<option value="">No Ollama models found</option>');
          blackModel.append('<option value="">No Ollama models found</option>');
          return;
        }

        ollamaModels.forEach((model) => {
          whiteModel.append(`<option value="${model}">${model}</option>`);
          blackModel.append(`<option value="${model}">${model}</option>`);
        });
      }

      function populateOpenRouterSelectors() {
        const whitePreset = $('#whiteOpenRouterPreset');
        const blackPreset = $('#blackOpenRouterPreset');
        const datalist = $('#openrouterModelList');

        whitePreset.html('<option value="">Custom model...</option>');
        blackPreset.html('<option value="">Custom model...</option>');
        datalist.empty();

        openrouterModels.forEach((model) => {
          whitePreset.append(`<option value="${model}">${model}</option>`);
          blackPreset.append(`<option value="${model}">${model}</option>`);
          datalist.append(`<option value="${model}"></option>`);
        });
      }

      function getSideConfig(side) {
        const prefix = side === 'white' ? 'white' : 'black';
        const kind = $(`#${prefix}PlayerType`).val();

        if (kind === 'human') {
          return { kind: 'human' };
        }

        if (kind === 'engine') {
          return { kind: 'engine', bot: $(`#${prefix}Engine`).val() || '' };
        }

        const provider = $(`#${prefix}AiProvider`).val();
        const model =
          provider === 'ollama'
            ? $(`#${prefix}OllamaModel`).val() || ''
            : ($(`#${prefix}OpenRouterModel`).val() || '').trim();

        return {
          kind: 'ai',
          provider,
          model,
        };
      }

      function applySideConfig(side, config) {
        const prefix = side === 'white' ? 'white' : 'black';

        if (!config || !config.kind) {
          $(`#${prefix}PlayerType`).val('human');
          updateSideUI(side);
          return;
        }

        $(`#${prefix}PlayerType`).val(config.kind);

        if (config.kind === 'engine') {
          if (config.bot) {
            $(`#${prefix}Engine`).val(config.bot);
          }
        }

        if (config.kind === 'ai') {
          const provider = config.provider === 'openrouter' ? 'openrouter' : 'ollama';
          $(`#${prefix}AiProvider`).val(provider);

          if (provider === 'ollama' && config.model) {
            $(`#${prefix}OllamaModel`).val(config.model);
          }

          if (provider === 'openrouter') {
            $(`#${prefix}OpenRouterModel`).val(config.model || '');
            if (config.model) {
              $(`#${prefix}OpenRouterPreset`).val(config.model);
            }
          }
        }

        updateSideUI(side);
      }

      function setStatusText(side, message, healthy) {
        const statusEl = side === 'white' ? $('#whiteAiStatus') : $('#blackAiStatus');
        statusEl.text(message);
        statusEl.css('color', healthy ? 'var(--green)' : 'var(--red)');
      }

      function ensureModelDefaults(side) {
        const prefix = side === 'white' ? 'white' : 'black';
        const provider = $(`#${prefix}AiProvider`).val();

        if (provider === 'ollama') {
          if (!$(`#${prefix}OllamaModel`).val()) {
            if (aiStatus.ollama.defaultModel) {
              $(`#${prefix}OllamaModel`).val(aiStatus.ollama.defaultModel);
            }
            if (!$(`#${prefix}OllamaModel`).val() && ollamaModels.length > 0) {
              $(`#${prefix}OllamaModel`).val(ollamaModels[0]);
            }
          }
          return;
        }

        if (!$(`#${prefix}OpenRouterModel`).val()) {
          const fallbackModel =
            aiStatus.openrouter.defaultModel || (openrouterModels.length ? openrouterModels[0] : '');
          if (fallbackModel) {
            $(`#${prefix}OpenRouterModel`).val(fallbackModel);
            $(`#${prefix}OpenRouterPreset`).val(fallbackModel);
          }
        }
      }

      function updateSideUI(side) {
        const prefix = side === 'white' ? 'white' : 'black';
        const kind = $(`#${prefix}PlayerType`).val();
        const provider = $(`#${prefix}AiProvider`).val();

        $(`#${prefix}EngineSelector`).toggleClass('hidden', kind !== 'engine');
        $(`#${prefix}AiSelector`).toggleClass('hidden', kind !== 'ai');

        if (kind === 'ai') {
          ensureModelDefaults(side);
          $(`#${prefix}OllamaModelGroup`).toggleClass('hidden', provider !== 'ollama');
          $(`#${prefix}OpenRouterModelGroup`).toggleClass('hidden', provider !== 'openrouter');

          if (provider === 'ollama') {
            if (aiStatus.ollama.reachable) {
              setStatusText(side, `Ollama reachable at ${aiStatus.ollama.url}`, true);
            } else {
              setStatusText(side, `Ollama not running or unreachable at ${aiStatus.ollama.url}`, false);
            }
          } else if (aiStatus.openrouter.apiKeyDetected) {
            setStatusText(side, 'OpenRouter API key detected', true);
          } else {
            setStatusText(side, 'Missing OPENROUTER_API_KEY in .env', false);
          }
        }
      }

      function saveSetupToLocalStorage() {
        const setup = {
          white: getSideConfig('white'),
          black: getSideConfig('black'),
        };
        localStorage.setItem(SETUP_STORAGE_KEY, JSON.stringify(setup));
      }

      function restoreSetupFromLocalStorage() {
        const raw = localStorage.getItem(SETUP_STORAGE_KEY);
        if (!raw) {
          return false;
        }

        try {
          const saved = JSON.parse(raw);
          applySideConfig('white', saved.white);
          applySideConfig('black', saved.black);
          return true;
        } catch (error) {
          console.log('Failed to restore saved setup:', error.message);
          return false;
        }
      }

      function bindUIEvents() {
        const sideFields = [
          '#whitePlayerType',
          '#whiteEngine',
          '#whiteAiProvider',
          '#whiteOllamaModel',
          '#whiteOpenRouterPreset',
          '#whiteOpenRouterModel',
          '#blackPlayerType',
          '#blackEngine',
          '#blackAiProvider',
          '#blackOllamaModel',
          '#blackOpenRouterPreset',
          '#blackOpenRouterModel',
        ];

        sideFields.forEach((selector) => {
          $(selector).on('change input', () => {
            updateSideUI('white');
            updateSideUI('black');
            saveSetupToLocalStorage();
          });
        });

        $('#whiteOpenRouterPreset').on('change', function () {
          const value = $(this).val();
          if (value) {
            $('#whiteOpenRouterModel').val(value);
          }
        });

        $('#blackOpenRouterPreset').on('change', function () {
          const value = $(this).val();
          if (value) {
            $('#blackOpenRouterModel').val(value);
          }
        });

        $('#copyWhiteToBlack').on('click', () => {
          const whiteSetup = getSideConfig('white');
          applySideConfig('black', whiteSetup);
          saveSetupToLocalStorage();
        });
      }

      $(document).ready(function () {
        const botsRequest = $.get('/api/bots')
          .done(function (bots) {
            availableBots = bots;
            populateEngineSelectors();
          })
          .fail(function () {
            availableBots = [];
            populateEngineSelectors();
          });

        const ollamaRequest = $.get('/api/llms')
          .done(function (models) {
            ollamaModels = models;
            populateOllamaSelectors();
          })
          .fail(function () {
            ollamaModels = [];
            populateOllamaSelectors();
          });

        const openrouterRequest = $.get('/api/openrouter-models')
          .done(function (models) {
            openrouterModels = models;
            populateOpenRouterSelectors();
          })
          .fail(function () {
            openrouterModels = [];
            populateOpenRouterSelectors();
          });

        const statusRequest = $.get('/api/ai-status')
          .done(function (response) {
            aiStatus = response;
          })
          .fail(function () {
            aiStatus = {
              ollama: { reachable: false, url: 'http://localhost:11434', defaultModel: '' },
              openrouter: { apiKeyDetected: false, defaultModel: '' },
            };
          });

        $.when(botsRequest, ollamaRequest, openrouterRequest, statusRequest).always(function () {
          bindUIEvents();

          const restored = restoreSetupFromLocalStorage();
          if (!restored) {
            if (availableBots.length > 0) {
              $('#blackPlayerType').val('engine');
              $('#blackEngine').val(availableBots[availableBots.length - 1].value);
            }
          }

          updateSideUI('white');
          updateSideUI('black');
        });
      });

      function onDragStart(source, piece, position, orientation) {
        // do not pick up pieces if the game is over
        if (game.game_over()) return false;

        // only pick up pieces for the side to move
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) || (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
          return false;
        }

        if (
          (game.turn() === 'w' && whitePlayerConfig.kind !== 'human') ||
          (game.turn() === 'b' && blackPlayerConfig.kind !== 'human')
        ) {
          return false;
        }
      }

      function onDrop(source, target) {
        // see if the move is legal
        let move;
        try {
          move = game.move({
            from: source,
            to: target,
            promotion: 'q', // NOTE: always promote to a queen for simplicity
          });
        } catch (e) {
          // illegal move
          console.log(e);
        }

        if (move === null) return 'snapback';

        socket.emit('makeMove', move);
      }

      // update the board position after the piece snap
      // for castling, en passant, pawn promotion
      function onSnapEnd() {
        board.position(game.fen());
      }

      const config = {
        draggable: true,
        position: 'start',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd,
        appearSpeed: 300,
        moveSpeed: 200,
        snapbackSpeed: 100,
        snapSpeed: 150,
      };

      // Initialize board after a short delay to ensure DOM is ready
      setTimeout(() => {
        board = Chessboard('board', config);
        // Remove placeholder
        document.querySelector('.chessboard-placeholder').style.display = 'none';
      }, 100);

      socket.on('boardState', (fen) => {
        try {
          game.load(fen);
        } catch (e) {
          console.log(e);
        }
        if (board) {
          board.position(fen);
        }
      });

      socket.on('gameStatus', (msg) => {
        status.text(msg);
      });

      socket.on('gamePgn', (pgnStr) => {
        pgn.text(pgnStr);
      });

      $('#startGame').on('click', () => {
        whitePlayerConfig = getSideConfig('white');
        blackPlayerConfig = getSideConfig('black');
        saveSetupToLocalStorage();

        socket.emit('startGame', {
          white: whitePlayerConfig,
          black: blackPlayerConfig,
        });
      });

      $('#resetGame').on('click', () => {
        socket.emit('resetGame');
      });
    </script>
  </body>
</html>
